<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#080910">
<title>CryptoBigot | Sign In</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#080910;color:#f5f6ff;font-family:Arial,sans-serif;padding:20px}
.card{width:100%;max-width:410px;background:#121421;border:1px solid #292c40;border-radius:24px;padding:30px 24px;box-shadow:0 20px 70px #0008}
.logo{font-size:27px;font-weight:800;text-align:center;margin-bottom:10px}.logo span{color:#9165ff}
.sub{text-align:center;color:#9ca3b8;margin-bottom:28px}
label{display:block;margin:17px 0 8px;color:#d5d8e8;font-size:14px}
input{width:100%;padding:15px;background:#090b14;border:1px solid #33364c;border-radius:12px;color:white;font-size:16px;outline:none}
input:focus{border-color:#8660ff}
button{width:100%;padding:15px;margin-top:22px;border:0;border-radius:12px;background:linear-gradient(100deg,#8855f7,#3478f6);color:white;font-size:16px;font-weight:bold;cursor:pointer}
.note{font-size:12px;color:#a6abc0;line-height:1.6;text-align:center;margin-top:20px}
.message{color:#ff9eae;text-align:center;font-size:14px;margin-top:14px;min-height:18px}
.back{display:block;text-align:center;margin-top:18px;color:#9db7ff;font-size:13px}
</style>
</head>
<body>
<main class="card">
  <div class="logo">₿ Crypto<span>Bigot</span></div>
  <p class="sub">Sign in to the practice dashboard</p>
  <form id="loginForm">
    <label for="username">Username</label>
    <input id="username" name="username" autocomplete="username" placeholder="Enter username" required>
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Enter password" required>
    <button type="submit">Sign in</button>
    <div class="message" id="message" role="status" aria-live="polite"></div>
  </form>
  <p class="note">
    DEMO ONLY — This is not a real exchange.<br>
    Username: <b>demo</b><br>
    Password: <b>demo123</b><br>
    No real accounts, deposits, withdrawals, or trades.
  </p>
  <a class="back" href="./index.html">Return to CryptoBigot</a>
</main>
<script>
(function () {
  "use strict";
  const form = document.getElementById("loginForm");
  const message = document.getElementById("message");
  form.addEventListener("submit", function (event) {
    event.preventDefault();
    const username = document.getElementById("username").value.trim();
    const password = document.getElementById("password").value;
    if (username === "demo" && password === "demo123") {
      // This key matches index.html. This is a client-side demo gate, not secure authentication.
      sessionStorage.setItem("cb_demo_login", "yes");
      window.location.href = "./index.html";
      return;
    }
    message.textContent = "Incorrect demo credentials. Try demo / demo123.";
  });
})();
</script>
</body>
</html>
